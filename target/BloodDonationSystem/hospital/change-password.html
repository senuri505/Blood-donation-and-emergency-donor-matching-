<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password — HemoLink Hospital</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand-icon"><i class="fa-solid fa-droplet"></i></div>
            <div class="brand-info">
                <h2>HemoLink</h2>
                <span>Hospital Portal</span>
            </div>
        </div>

        <nav class="sidebar-menu">
            <div class="menu-category">Menu</div>
            <a href="dashboard.html" class="menu-item"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="search-donors.html" class="menu-item"><i class="fa-solid fa-magnifying-glass"></i> Find Donors</a>
            <a href="requests.html" class="menu-item"><i class="fa-solid fa-hand-holding-medical"></i> Blood Requests</a>
            <a href="donations.html" class="menu-item"><i class="fa-solid fa-clock-rotate-left"></i> Donations</a>
        </nav>

        <div class="sidebar-footer">
            <div class="user-profile-mini">
                <div class="user-avatar" id="hosp-avatar">NH</div>
                <div class="user-details">
                    <h4 id="hosp-sidebar-name">National Hospital Colombo</h4>
                    <p id="hosp-sidebar-city">Colombo</p>
                </div>
            </div>
            <a href="../LogoutServlet" class="btn-logout-icon" title="Logout"><i class="fa-solid fa-arrow-right-from-bracket"></i></a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-wrapper">
        <header class="topbar">
            <div class="topbar-title">
                <h1>Change Password</h1>
            </div>
        </header>

        <div class="content-body">
            <div class="card-panel" style="max-width:500px;">
                <form id="form-change-password" onsubmit="handleChangePassword(event)">
                    <div class="form-group">
                        <label class="form-label">Current Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="current-password" class="form-control" placeholder="Enter current password" required>
                            <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('current-password', this)" title="Show password">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">New Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="new-password" class="form-control" placeholder="Enter new password" required>
                            <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('new-password', this)" title="Show password">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                        <small style="color: var(--text-muted); margin-top: 6px; display: block;">
                            Password must be at least 6 characters long.
                        </small>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Confirm New Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="confirm-password" class="form-control" placeholder="Confirm new password" required>
                            <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('confirm-password', this)" title="Show password">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 24px;">
                        <button type="submit" class="btn btn-primary" style="flex: 1;"><i class="fa-solid fa-key"></i> Change Password</button>
                        <a href="dashboard.html" class="btn btn-secondary" style="flex: 1; text-decoration: none; text-align: center;"><i class="fa-solid fa-arrow-left"></i> Back</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div id="toast-container"></div>

    <script src="../js/script.js"></script>
    <script>
        let currentHospitalId = null;

        async function loadHospitalInfo() {
            const data = await apiGet('DashboardServlet?action=hospital');
            if (!data || !data.hospital) return;
            const h = data.hospital;
            currentHospitalId = h.id;

            const initials = h.name ? h.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() : 'HR';
            document.getElementById('hosp-avatar').innerText = initials;
            document.getElementById('hosp-sidebar-name').innerText = h.name || 'Hospital';
            document.getElementById('hosp-sidebar-city').innerText = h.city || 'City';
        }

        async function handleChangePassword(e) {
            e.preventDefault();

            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword.length < 6) {
                showToast('New password must be at least 6 characters long', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showToast('New password and confirmation do not match', 'error');
                return;
            }

            if (newPassword === currentPassword) {
                showToast('New password must be different from current password', 'error');
                return;
            }

            const data = {
                action: 'changePassword',
                currentPassword: currentPassword,
                newPassword: newPassword,
                id: currentHospitalId
            };

            const res = await apiPost('HospitalServlet', data);
            if (res && res.success) {
                showToast('Password changed successfully', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            } else {
                showToast(res ? res.message : 'Failed to change password. Please check your current password.', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadHospitalInfo);
    </script>
</body>
</html>
