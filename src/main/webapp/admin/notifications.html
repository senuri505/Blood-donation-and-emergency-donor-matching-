<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications — HemoLink Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand-icon"><i class="fa-solid fa-droplet"></i></div>
            <div class="brand-info">
                <h2>HemoLink</h2>
                <span>Admin Panel</span>
            </div>
        </div>

        <nav class="sidebar-menu">
            <div class="menu-category">Overview</div>
            <a href="dashboard.html" class="menu-item"><i class="fa-solid fa-chart-line"></i> Dashboard</a>

            <div class="menu-category">Management</div>
            <a href="users.html" class="menu-item"><i class="fa-solid fa-users"></i> Manage Users</a>
            <a href="approvals.html" class="menu-item"><i class="fa-solid fa-user-check"></i> Approvals</a>
            <a href="hospitals.html" class="menu-item"><i class="fa-solid fa-hospital"></i> Hospitals</a>

            <div class="menu-category">Operations</div>
            <a href="blood-stock.html" class="menu-item"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a>

            <div class="menu-category">System</div>
            <a href="donations.html" class="menu-item"><i class="fa-solid fa-clock-rotate-left"></i> Donation History</a>
            <a href="notifications.html" class="menu-item active"><i class="fa-solid fa-bell"></i> Notifications</a>
            <a href="settings.html" class="menu-item"><i class="fa-solid fa-gear"></i> Settings</a>
        </nav>

        <div class="sidebar-footer">
            <div class="user-profile-mini">
                <div class="user-avatar">SA</div>
                <div class="user-details">
                    <h4>System Admin</h4>
                    <p>admin</p>
                </div>
            </div>
            <a href="../LogoutServlet" class="btn-logout-icon" title="Logout"><i class="fa-solid fa-arrow-right-from-bracket"></i></a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-wrapper">
        <header class="topbar">
            <div class="topbar-title">
                <h1>Notifications & Contact Inquiries</h1>
            </div>
            <div class="topbar-actions">
                <button class="btn btn-secondary btn-sm" onclick="markAllNotificationsRead()"><i class="fa-solid fa-check-double"></i> Mark All as Read</button>
            </div>
        </header>

        <div class="content-body">
            <!-- Filter Tabs -->
            <div style="display:flex; gap:12px; margin-bottom:24px; border-bottom: 1px solid var(--border-color); padding-bottom:12px;">
                <button class="btn btn-sm btn-primary" id="tab-btn-all" onclick="switchTab('all')"><i class="fa-solid fa-bell"></i> System Notifications</button>
                <button class="btn btn-sm btn-secondary" id="tab-btn-contact" onclick="switchTab('contact')"><i class="fa-solid fa-envelope"></i> Contact Inquiries <span id="contact-unread-badge" class="badge badge-danger" style="margin-left:6px; display:none;">0</span></button>
            </div>

            <div id="notif-list-container">
                <!-- JS populated -->
            </div>
        </div>
    </main>

    <div id="toast-container"></div>

    <script src="../js/script.js?v=3"></script>
    <script>
        let currentTab = 'all';

        function switchTab(tab) {
            currentTab = tab;
            const btnAll = document.getElementById('tab-btn-all');
            const btnContact = document.getElementById('tab-btn-contact');
            if (tab === 'all') {
                btnAll.className = 'btn btn-sm btn-primary';
                btnContact.className = 'btn btn-sm btn-secondary';
            } else {
                btnAll.className = 'btn btn-sm btn-secondary';
                btnContact.className = 'btn btn-sm btn-primary';
            }
            loadNotifications();
        }

        async function loadNotifications() {
            const container = document.getElementById('notif-list-container');
            container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>';

            if (currentTab === 'all') {
                const list = await apiGet('NotificationServlet');
                container.innerHTML = '';

                const adminNotifs = (list || []).filter(n => n.type === 'approval' || n.type === 'registration');

                if (adminNotifs.length === 0) {
                    container.innerHTML = '<div class="card-panel" style="color:var(--text-muted); text-align:center;">No registration approval notifications found.</div>';
                    return;
                }

                adminNotifs.forEach(n => {
                    const card = document.createElement('div');
                    card.className = 'card-panel';
                    card.style.marginBottom = '12px';
                    card.style.opacity = n.isRead ? '0.65' : '1';

                    let icon = 'fa-info-circle';
                    let color = 'var(--info)';
                    if (n.type === 'approval') { icon = 'fa-user-clock'; color = 'var(--warning)'; }
                    if (n.type === 'request') { icon = 'fa-droplet'; color = 'var(--danger)'; }
                    if (n.type === 'success') { icon = 'fa-check-circle'; color = 'var(--success)'; }
                    if (n.type === 'contact') { icon = 'fa-envelope-open-text'; color = 'var(--primary)'; }

                    const statusBadge = n.isRead 
                        ? '<span class="badge" style="background:rgba(255,255,255,0.08); color:var(--text-muted);">Read</span>'
                        : '<span class="badge badge-danger">Unread</span>';

                    card.innerHTML = `
                        <div style="display:flex; align-items:flex-start; gap:16px;">
                            <div style="color:${color}; font-size:22px; margin-top:2px;"><i class="fa-solid ${icon}"></i></div>
                            <div style="flex:1;">
                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <div style="font-size:15px; font-weight:700; color:#fff;">${n.title}</div>
                                    ${statusBadge}
                                </div>
                                <div style="font-size:13px; color:var(--text-main); margin-top:6px; line-height:1.5;">${n.message}</div>
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                                    <div style="font-size:11px; color:var(--text-muted);"><i class="fa-regular fa-clock"></i> ${n.createdAt ? (typeof n.createdAt === 'string' ? n.createdAt.substring(0,19).replace('T', ' ') : n.createdAt) : 'Just now'}</div>
                                    ${!n.isRead ? `<button class="btn btn-secondary btn-sm" onclick="markSingleNotifRead(${n.id})" style="padding:4px 10px; font-size:11px;"><i class="fa-solid fa-check"></i> Mark Read</button>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } else {
                // Contact Inquiries Tab
                const messages = await apiGet('ContactServlet');
                container.innerHTML = '';

                if (!messages || messages.length === 0) {
                    container.innerHTML = '<div class="card-panel" style="color:var(--text-muted); text-align:center;">No contact inquiries received yet.</div>';
                    return;
                }

                // Update badge
                const unreadCount = messages.filter(m => m.status === 'unread').length;
                const badgeEl = document.getElementById('contact-unread-badge');
                if (badgeEl) {
                    badgeEl.innerText = unreadCount;
                    badgeEl.style.display = unreadCount > 0 ? 'inline-block' : 'none';
                }

                messages.forEach(msg => {
                    const card = document.createElement('div');
                    card.className = 'card-panel';
                    card.style.marginBottom = '14px';
                    card.style.borderLeft = msg.status === 'unread' ? '4px solid var(--primary)' : '1px solid var(--border-color)';
                    card.style.opacity = msg.status === 'read' ? '0.75' : '1';

                    const isUnread = msg.status === 'unread';
                    const statusBadge = isUnread 
                        ? '<span class="badge badge-danger" style="font-size:11px;"><i class="fa-solid fa-envelope"></i> Unread</span>'
                        : '<span class="badge badge-success" style="font-size:11px;"><i class="fa-solid fa-envelope-open"></i> Read</span>';

                    card.innerHTML = `
                        <div style="display:flex; flex-direction:column; gap:10px;">
                            <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px;">
                                <div>
                                    <h3 style="font-size:16px; font-weight:700; color:#fff; display:flex; align-items:center; gap:8px;">
                                        <i class="fa-solid fa-user-circle" style="color:var(--primary);"></i> ${msg.name}
                                    </h3>
                                    <div style="font-size:13px; color:var(--info); margin-top:2px;">
                                        <i class="fa-solid fa-paper-plane"></i> ${msg.email}
                                    </div>
                                </div>
                                <div>${statusBadge}</div>
                            </div>
                            <div style="background:rgba(0,0,0,0.2); padding:12px 14px; border-radius:8px; font-size:13.5px; color:var(--text-main); line-height:1.6; border:1px solid rgba(255,255,255,0.05);">
                                ${msg.message}
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
                                <div style="font-size:11.5px; color:var(--text-muted);">
                                    <i class="fa-regular fa-calendar"></i> Submitted: ${msg.createdAt ? (typeof msg.createdAt === 'string' ? msg.createdAt.substring(0,19).replace('T', ' ') : msg.createdAt) : 'Just now'}
                                </div>
                                ${isUnread ? `
                                    <button class="btn btn-primary btn-sm" onclick="markContactRead(${msg.id})" style="padding:5px 12px; font-size:12px;">
                                        <i class="fa-solid fa-check"></i> Mark as Read
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        async function markSingleNotifRead(id) {
            const res = await apiPost('NotificationServlet', { action: 'markRead', id: id });
            if (res && res.success) {
                showToast('Notification marked as read', 'success');
                loadNotifications();
                updateNotifBadge();
            }
        }

        async function markContactRead(id) {
            const res = await apiPost('ContactServlet', { action: 'markRead', id: id });
            if (res && res.success) {
                showToast('Contact message marked as read', 'success');
                loadNotifications();
                updateNotifBadge();
            }
        }

        async function markAllNotificationsRead() {
            const res = await apiPost('NotificationServlet', { action: 'markAllRead' });
            if (res && res.success) {
                showToast('All notifications marked as read', 'success');
                loadNotifications();
                updateNotifBadge();
            }
        }

        document.addEventListener('DOMContentLoaded', loadNotifications);
    </script>
</body>
</html>
